# LOCAL DEVELOPMENT ONLY.
#
# Deliberately not named `wrangler.toml`: Cloudflare Pages' CI picks up a file
# with that exact name and then *ignores every binding set in the dashboard*,
# which would silently drop TURNSTILE_SECRET in production. Pass this file
# explicitly instead:
#
#   npx wrangler pages dev -c wrangler.dev.toml
#   npx wrangler d1 execute DB -c wrangler.dev.toml --local --file=./schema.sql
#
# Production bindings stay where they are today: Pages project -> Settings.

name = "pranaym-website"
compatibility_date = "2025-07-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "pranaym-comments"
database_id = "f8b03ae3-80cd-4ebd-8bd6-ecd18b04a6a6"
